kind = "mobile"
previewPath = "/mobile/"
title = "Ishiki Mobile"
description = "A secure iOS and Android companion for quick capture, medication doses, events, offline synchronization, reminders, camera attachments, and read-only Apple Health review."
version = "1.0.0"
id = "artifacts/syntropic-mobile"
router = "expo-domain"

[[services]]
name = "expo"
ensurePreviewReachable = "/status"
paths = [ "/mobile/" ]
localPort = 21967

[services.development]
run = "pnpm --filter @workspace/syntropic-mobile run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/syntropic-mobile", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/syntropic-mobile", "run", "serve" ]

[services.env]
PORT = "21967"
BASE_PATH = "/mobile/"